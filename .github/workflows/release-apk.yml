name: Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build and publish release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.2"
          channel: stable
          cache: true

      - name: Ensure platform folders
        run: flutter create . --platforms android,web --project-name toad_health

      - name: Remove generated template test
        run: rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate launcher icons (running toad)
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Build Wear OS companion APK (release)
        run: (cd android && ./gradlew :wear:assembleRelease --no-daemon)

      - name: Collect APKs
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk toadHEALTH.apk
          cp build/wear/outputs/apk/release/wear-release.apk toadHEALTH-wear.apk

      - name: Upload phone release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: toadhealth-release-apk
          path: toadHEALTH.apk

      - name: Upload wear release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: toadhealth-wear-release-apk
          path: toadHEALTH-wear.apk

      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            toadHEALTH.apk
            toadHEALTH-wear.apk
          generate_release_notes: true
