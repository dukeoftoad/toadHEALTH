name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-build:
    name: Analyze and debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.2"
          channel: stable
          cache: true

      - name: Ensure platform folders
        run: flutter create . --platforms android,web --project-name toad_health

      - name: Remove generated template test
        run: rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate launcher icons (running toad)
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze

      - name: Build debug APK
        run: flutter build apk --debug

      # The root `assembleDebug` above already compiles :wear (it runs in
      # every project that has the task); this step uploads its APK.
      - name: Upload wear debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: toadhealth-wear-debug-apk
          path: android/wear/build/outputs/apk/debug/wear-debug.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: toadhealth-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
