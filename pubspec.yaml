name: toad_health
description: "toadHEALTH - a hand-drawn, local-first, end-to-end encrypted health companion with a toad at its heart."
publish_to: 'none'
version: 1.3.0+5

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Pure-Dart cryptography (AES-256-GCM, PBKDF2-HMAC-SHA256).
  # No native code, no telemetry, no Google dependencies.
  cryptography: ^2.7.0

dev_dependencies:
  flutter_lints: ^4.0.0
  # Stamps the hand-drawn running-toad artwork into the Android launcher
  # icons (legacy + adaptive). Run: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4

# The app icon is drawn to match the in-app toad: wobbly ink outlines,
# swamp green body, cream belly, coral cheek - mid-gallop with a heart.
# flutter_launcher_icons insets the full-bleed artwork by 16% for the
# adaptive foreground, landing the toad inside the launcher safe zone.
flutter_launcher_icons:
  image_path: 'assets/images/app_icon.png'
  android: true
  ios: false
  adaptive_icon_background: '#F0E3C1'

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_icon.png
    - assets/images/banner.png
  fonts:
    - family: PatrickHand
      fonts:
        - asset: assets/fonts/PatrickHand-Regular.ttf
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat.ttf
