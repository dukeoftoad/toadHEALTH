plugins {
    id "com.android.application"
    id "kotlin-android"
}

// The Wear OS companion module: a tiny native Kotlin app that lives on the
// wrist and mirrors the pond (steps / water / sleep / heart rate) while the
// phone runs the Flutter app. Built separately with `:wear:assembleRelease`;
// the Flutter toolchain never touches this module.
android {
    namespace = "com.toadhealth.wear"
    compileSdk = 34

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        applicationId = "com.toadhealth.wear"
        minSdk = 26
        targetSdk = 33
        versionCode = 1
        versionName = "1.0"
    }

    buildTypes {
        release {
            // Same policy as the phone app: the CI release artifact is signed
            // with the debug key so reviewers can sideload it directly.
            signingConfig = signingConfigs.debug
            minifyEnabled = false
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    // Ambient mode support (dim-on-idle burn-in protection).
    implementation "androidx.wear:wear:1.3.0"
    // The Wear Data Layer transport: device-to-device messages over the
    // watch Bluetooth/USB bridge. No cloud endpoint, no account, no data
    // ever leaves the two paired devices.
    implementation "com.google.android.gms:play-services-wearable:18.1.0"
}
